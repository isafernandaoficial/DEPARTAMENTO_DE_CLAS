<style>
/* Layout: uma pergunta por tela, coluna estreita centrada, toque grande, barra de progresso no topo */
:root{
  --bg:#FAF1E8; --fg:#0F2226; --card:#FFFFFF; --line:#E2CDB8; --muted:#4A5458;
  --coral:#FF7A59; --coral-ink:#B9432A; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#8A5A1F;
  --on-coral:#0F2226; --chip:#F3E3D3;
  --display:"Unbounded", "Arial Black", Arial, sans-serif;
  --body:"Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866;
  --on-coral:#0F2226; --chip:#1E3D46; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866;
  --on-coral:#0F2226; --chip:#1E3D46; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
.wrap{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-block:20px 32px; gap:20px}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:600; font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.brand img{height:30px; width:auto}
.demo{font-size:12px; font-weight:600; color:var(--gold-ink); border:1px solid var(--line); border-radius:999px; padding:4px 10px}
.progress{height:6px; background:var(--chip); border-radius:999px; overflow:hidden}
.progress span{display:block; height:100%; background:var(--coral); width:0; transition:width .3s ease}
.meta{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-weight:600}
.sec{font-family:var(--display); font-weight:600; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--coral-ink)}
h1{font-family:var(--display); font-weight:800; font-size:clamp(26px, 7vw, 34px); line-height:1.15; margin:0; text-wrap:balance}
h2{font-family:var(--display); font-weight:600; font-size:clamp(20px, 5.4vw, 24px); line-height:1.3; margin:0; text-wrap:balance}
p{margin:0}
.lead{font-size:17px; color:var(--muted)}
.hint{font-size:14px; color:var(--muted)}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:14px; width:100%; min-height:56px; text-align:left; font:inherit; font-weight:600; font-size:16px;
  color:var(--fg); background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 18px; cursor:pointer; transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--coral)}
.opt .mark{width:22px; height:22px; flex-shrink:0; border:2px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--coral); background:color-mix(in srgb, var(--coral) 14%, var(--card))}
.opt[aria-pressed="true"] .mark{background:var(--coral); border-color:var(--coral)}
.opt[aria-pressed="true"] .mark::after{content:""; width:8px; height:8px; border-radius:2px; background:var(--on-coral)}
.scale{display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px}
.scale .opt{justify-content:center; padding:0; min-height:64px; font-family:var(--display); font-size:20px}
.scale-ends{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-weight:600}
input[type=text], input[type=tel], input[type=email], textarea{width:100%; font:inherit; font-size:16px; color:var(--fg); background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px}
textarea{min-height:130px; resize:vertical}
label{font-weight:600; font-size:14px; display:block; margin-bottom:6px}
.field{display:flex; flex-direction:column}
.actions{display:flex; gap:10px; align-items:center; margin-top:auto; padding-top:8px}
.btn{font:inherit; font-weight:700; font-size:16px; border-radius:999px; padding:14px 26px; cursor:pointer; border:1.5px solid transparent; min-height:52px}
.btn.primary{background:var(--fg); color:var(--bg)}
.btn.primary:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--fg); border-color:var(--line)}
.btn.link{background:transparent; color:var(--muted); padding-inline:12px}
.grow{flex:1}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.hero{display:flex; flex-direction:column; gap:18px; padding-top:12px}
.hero .logo{width:76px; height:auto}
.facts{display:flex; flex-wrap:wrap; gap:8px}
.facts span{background:var(--chip); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600}
.band{background:var(--rosa); color:#0F2226; border-radius:16px; padding:18px 20px; font-size:15px; font-weight:500}
.done{display:flex; flex-direction:column; gap:16px; padding-top:20px}
.done .check{width:64px; height:64px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center}
details{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px}
summary{cursor:pointer; font-weight:600}
pre{white-space:pre-wrap; word-break:break-word; font-size:13px; margin:10px 0 0; max-height:320px; overflow:auto}
.err{color:var(--coral-ink); font-weight:600; font-size:14px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

async function carregarClas(){

}

function visiveis(){ return Q.filter(q => !q.cond || q.cond(A)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

    const outro = A.claOutro;
    corpo = '<div class="opts" role="group" aria-label="' + esc(q.q) + '">' + CLAS.concat([OUTRO]).map((o,i) =>
      '<button type="button" class="opt" data-i="' + i + '" aria-pressed="' + (o === OUTRO ? !!outro : (!outro && v === o)) + '"><span class="mark"></span>' + esc(o) + '</button>').join("") + '</div>';
    if (outro) corpo += '<div class="field"><label for="campo">Nome do seu clã</label><input id="campo" type="text" placeholder="' + esc(q.ph) + '" value="' + esc(v || "") + '"></div>';
  } else if (q.type === "cla"){
    corpo = '<div class="field"><label for="campo">Resposta</label><input id="campo" type="text" placeholder="' + esc(q.ph) + '" value="' + esc(v || "") + '"></div>';
  } else if (q.type === "multi"){
    const sel = v || [];
    corpo = '<p class="hint">Escolha quantas quiser.</p><div class="opts" role="group" aria-label="' + esc(q.q) + '">' + q.o.map((o,i) =>
      '<button type="button" class="opt multi" data-i="' + i + '" aria-pressed="' + sel.includes(o) + '"><span class="mark"></span>' + esc(o) + '</button>').join("") + '</div>';
  } else if (q.type === "scale"){
    corpo = '<div class="scale" role="group" aria-label="' + esc(q.q) + '">' + [1,2,3,4,5].map(n =>
      '<button type="button" class="opt" data-n="' + n + '" aria-pressed="' + (v === n) + '" aria-label="' + n + ' de 5">' + n + '</button>').join("") + '</div>' +
      '<div class="scale-ends"><span>1 · ' + esc(q.lo) + '</span><span>5 · ' + esc(q.hi) + '</span></div>';
  } else if (q.type === "text"){
    corpo = '<div class="field"><label for="campo">Resposta</label><input id="campo" type="text" placeholder="' + esc(q.ph) + '" value="' + esc(v || "") + '"></div>';
  } else if (q.type === "long"){
    corpo = '<div class="field"><label for="campo">Mensagem (opcional)</label><textarea id="campo" placeholder="' + esc(q.ph) + '">' + esc(v || "") + '</textarea></div>';
  }
  const ultimo = step === vs.length - 1;
  const precisaBotao = q.type !== "single" && q.type !== "scale";
  const pronto = (q.type === "text" || q.type === "cla") ? !!(v && v.trim()) : q.type === "cafe" ? !!v : true;
  app.innerHTML = topo() +
    '<div class="progress" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
    '<div class="meta"><span>' + esc(q.sec) + '</span><span>' + (step + 1) + ' de ' + vs.length + '</span></div>' +
    '<h2 id="pergunta">' + esc(q.q) + '</h2>' + corpo +
    '<div class="actions"><button type="button" class="btn ghost" id="voltar">Voltar</button>' +
    (q.type === "multi" || q.type === "long" ? '<button type="button" class="btn link" id="pular">Pular</button>' : '') +
    (precisaBotao ? '<button type="button" class="btn primary grow" id="seguir"' + (pronto ? '' : ' disabled') + '>' + (ultimo ? 'Enviar respostas' : 'Continuar') + '</button>' : '') +
    '</div>';
  ligar(q, ultimo);
  requestAnimationFrame(() => { const t = document.getElementById("pergunta"); if (t) t.setAttribute("tabindex","-1"); });
}

function avancar(){ step++; render(); window.scrollTo(0,0); }

function ligar(q, ultimo){
  document.getElementById("voltar").onclick = () => { step--; render(); };
  const pular = document.getElementById("pular");
  if (pular) pular.onclick = () => { delete A[q.id]; avancar(); };
  const seguir = document.getElementById("seguir");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (q.type === "single"){ A[q.id] = q.o[+b.dataset.i]; render(); setTimeout(avancar, 200); }
    else if (q.type === "scale"){ A[q.id] = +b.dataset.n; render(); setTimeout(avancar, 200); }
    else if (q.type === "multi"){ const o = q.o[+b.dataset.i]; const s = new Set(A[q.id] || []); s.has(o) ? s.delete(o) : s.add(o); A[q.id] = [...s]; b.setAttribute("aria-pressed", s.has(o)); }
    else if (q.type === "cafe"){ A.cafe = q.o[+b.dataset.i]; if (A.cafe !== "Sim, quero"){ delete A.nome; delete A.whatsapp; delete A.email; } render(); }
    else if (q.type === "cla"){
      const o = CLAS.concat([OUTRO])[+b.dataset.i];
      if (o === OUTRO){ A.claOutro = true; if (CLAS.indexOf(A.cla) >= 0) delete A.cla; render(); }
      else { A.claOutro = false; A.cla = o; render(); setTimeout(avancar, 200); }
    }
  });
  const campo = document.getElementById("campo");
  if (campo){ campo.oninput = () => { A[q.id] = campo.value; if (seguir && q.req) seguir.disabled = !campo.value.trim(); }; campo.focus(); }
  const nome = document.getElementById("nome"), zap = document.getElementById("whatsapp"), mail = document.getElementById("email");
  if (nome) nome.oninput = () => A.nome = nome.value;
  if (zap) zap.oninput = () => A.whatsapp = zap.value;
  if (mail) mail.oninput = () => A.email = mail.value;
  if (seguir) seguir.onclick = avancar;
}

function linha(){
  const r = {versao:"v1"};
  visiveis().forEach(q => {
    if (q.type === "cafe"){ r.quer_cafe = A.cafe === "Sim, quero"; }
    else if (A[q.id] !== undefined && A[q.id] !== "") r[q.id] = typeof A[q.id] === "string" ? A[q.id].trim() : A[q.id];
  });
  if (r.quer_cafe){
    if (A.nome) r.nome = A.nome.trim();
    if (A.whatsapp) r.whatsapp = A.whatsapp.trim();
    const mail = (A.email || "").trim().toLowerCase();
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) r.email = mail;
  }
  return r;
}

async function enviar(){
  const r = linha();
  app.innerHTML = topo() + '<div class="done"><h2>Enviando...</h2></div>';
  if (!SUPABASE_URL){
    return fim(r, "Nesta versão de prévia as respostas ainda não são salvas.");
  }
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + TABELA, {
      method:"POST",
      headers:{"apikey":SUPABASE_KEY, "Authorization":"Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal"},
      body: JSON.stringify(r)
    });
    if (!res.ok) throw new Error(res.status);
    fim(null, "Muito obrigado por responder.");
  } catch(e){
    app.innerHTML = topo() + '<div class="done"><h2>Não foi possível enviar agora</h2><p class="err">Verifique sua internet e tente de novo. Suas respostas continuam aqui.</p></div>' +
      '<div class="actions"><button class="btn ghost" type="button" id="voltar">Voltar</button><button class="btn primary grow" type="button" id="denovo">Tentar de novo</button></div>';
    document.getElementById("voltar").onclick = () => { step = visiveis().length - 1; render(); };
    document.getElementById("denovo").onclick = enviar;
  }
}

function fim(r, msg){
  app.innerHTML = topo() + '<div class="done"><div class="check" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F2226" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>' +
    '<h1>' + (r ? 'Prévia concluída' : 'Respostas recebidas!') + '</h1><p class="lead">' + esc(msg) + ' Cada resposta ajuda a liderança a cuidar melhor do seu clã.</p>' +
    (A.cafe === "Sim, quero" ? '<div class="band">Alguém do seu clã vai entrar em contato para marcar o café online.</div>' : '') +
    (r ? '<details><summary>Ver os dados desta prévia</summary><pre>' + esc(JSON.stringify(r, null, 2)) + '</pre></details>' : '') +
    '</div><div class="actions"><button class="btn ghost grow" type="button" id="reiniciar">Responder de novo</button></div>';
  document.getElementById("reiniciar").onclick = () => { for (const k in A) delete A[k]; step = -1; render(); };
}

render();
carregarClas();
</script>
