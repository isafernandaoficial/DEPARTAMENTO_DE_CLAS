<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel dos Clãs Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho, abas, faixa de filtros e lista de cartões; uma coluna no celular */
:root{
  --bg:#FAF1E8; --fg:#0F2226; --card:#FFFFFF; --line:#E2CDB8; --muted:#4A5458; --chip:#F3E3D3;
  --coral:#FF7A59; --coral-ink:#B9432A; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#8A5A1F; --verde:#2F9E5C; --azul:#2F6FB0;
  --display:"Unbounded", "Arial Black", Arial, sans-serif;
  --body:"Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5; --chip:#1E3D46;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866; --verde:#5CC48A; --azul:#7FB2E5; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5; --chip:#1E3D46;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866; --verde:#5CC48A; --azul:#7FB2E5; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
.wrap{max-width:1100px; margin:0 auto; padding-block:20px 56px; display:flex; flex-direction:column; gap:18px}
main{display:flex; flex-direction:column; gap:18px; min-width:0}
.topo{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.brand img{height:36px; width:auto}
.brand b{font-family:var(--display); font-size:15px; letter-spacing:.02em}
.brand small, .eu small{display:block; font-size:12px; color:var(--muted); font-weight:600}
.quem{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.eu{display:flex; flex-direction:column; line-height:1.25; text-align:right}
.eu b{font-size:14px}
h1{font-family:var(--display); font-weight:800; font-size:clamp(22px, 4.6vw, 30px); line-height:1.15; margin:0; text-wrap:balance}
h2{font-family:var(--display); font-weight:600; font-size:18px; margin:0}
p{margin:0}
.muted{color:var(--muted)}
.hint{font-size:13px; color:var(--muted)}
.btn{font:inherit; font-weight:700; font-size:14px; border-radius:999px; padding:9px 16px; cursor:pointer; border:1.5px solid var(--line); background:var(--card); color:var(--fg); min-height:42px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn.zap{background:#25D366; color:#0F2226; border-color:#25D366}
.btn.perigo{background:var(--coral); color:#0F2226; border-color:var(--coral)}
.btn:disabled{opacity:.5; cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
input, select, textarea{font:inherit; font-size:15px; color:var(--fg); background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; min-height:42px; width:100%; min-width:0}
textarea{min-height:90px; resize:vertical}
label{font-weight:600; font-size:13px; display:block; margin-bottom:5px}
.campo{display:flex; flex-direction:column; min-width:0}
.check{display:flex; align-items:center; gap:8px; margin:0; min-height:42px; font-weight:600; font-size:14px}
.check input{width:18px; height:18px; min-height:auto; padding:0}
.login{max-width:440px; margin:6vh auto 0; display:flex; flex-direction:column; gap:16px}
.gbtn{min-height:48px}
.aviso{background:var(--rosa); color:#0F2226; border-radius:14px; padding:12px 16px; font-weight:600}
.erro{color:var(--coral-ink); font-weight:600}
.status{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted)}
.status i{width:9px; height:9px; border-radius:50%; background:var(--line)}
.status.on i{background:var(--verde)}
.abas{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1.5px solid var(--line); padding-bottom:10px}
.aba{font-weight:700; font-size:14px; color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:999px}
.aba.on{background:var(--fg); color:var(--bg)}
.num{display:inline-block; min-width:20px; padding:0 6px; border-radius:999px; background:var(--coral); color:#0F2226; font-size:12px; text-align:center}
.barra{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font:inherit; font-size:13px; font-weight:700; border:1.5px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:6px 12px; cursor:pointer; min-height:36px}
.chip span{color:var(--muted); font-weight:600}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip.on span{color:var(--bg)}
.filtros{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.filtros .campo{flex:1 1 200px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap:12px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:2px}
.tile span{font-size:13px; font-weight:600; color:var(--muted)}
.tile b{font-family:var(--display); font-size:26px; font-variant-numeric:tabular-nums}
.tile.cafe{background:var(--rosa); border-color:var(--rosa); color:#0F2226}
.tile.cafe span{color:#0F2226}
.lista{display:flex; flex-direction:column; gap:12px}
.resp{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; min-width:0}
.resp.novo{box-shadow:0 0 0 3px var(--gold)}
.resumo{all:unset; box-sizing:border-box; cursor:pointer; width:100%; padding:14px 18px; display:flex; flex-direction:column; gap:4px}
.resumo:focus-visible{outline:3px solid var(--gold); outline-offset:-3px}
.resumo .t{font-weight:700; font-size:16px}
.sub{font-size:13px; color:var(--muted); font-weight:600}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.badge{background:var(--chip); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700}
.badge.cafe{background:var(--rosa); color:#0F2226}
.badge.alerta, .badge.st-novo{background:var(--coral); color:#0F2226}
.badge.st-agendado{background:var(--azul); color:#FFFFFF}
.badge.st-realizado{background:var(--verde); color:#0F2226}
.badge.st-acompanhamento{background:var(--gold); color:#0F2226}
.detalhe{border-top:1px solid var(--line); padding:14px 18px 18px; display:flex; flex-direction:column; gap:14px}
.dl{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap:10px 24px; margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.dl dd{margin:2px 0 0; font-weight:600; overflow-wrap:anywhere}
.dl .full{grid-column:1 / -1}
.bloco{display:flex; flex-direction:column; gap:10px; background:var(--bg); border-radius:14px; padding:14px}
.bloco h3{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.linha{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.linha .campo{flex:1 1 180px}
.acoes{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.contato{display:flex; flex-wrap:wrap; gap:8px 16px; font-weight:600; overflow-wrap:anywhere}
.contato a{color:var(--coral-ink)}
.painel-form{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.grade{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap:12px}
.opcoes{display:flex; flex-wrap:wrap; gap:4px 16px}
.tabela-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:16px}
.tabela{border-collapse:collapse; width:100%; min-width:640px; font-size:14px}
.tabela th, .tabela td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.tabela th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.tabela tr:last-child td{border-bottom:0}
.tabela tr.inativo td{color:var(--muted)}
.vazio{background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:28px 20px; text-align:center; color:var(--muted); display:flex; flex-direction:column; gap:12px; align-items:center}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); max-width:calc(100% - 32px); background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:16px; font-weight:700; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.2); z-index:10}
.toast.erro{background:var(--coral); color:#0F2226}
@media (max-width:600px){ .eu{text-align:left} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
