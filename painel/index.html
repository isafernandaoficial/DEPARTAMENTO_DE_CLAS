<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel dos Clãs Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho fixo, faixa de números, filtros e lista de respostas em cartões; uma coluna no celular */
:root{
  --bg:#FAF1E8; --fg:#0F2226; --card:#FFFFFF; --line:#E2CDB8; --muted:#4A5458; --chip:#F3E3D3;
  --coral:#FF7A59; --coral-ink:#B9432A; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#8A5A1F; --novo:#FFF3C4;
  --display:"Unbounded", "Arial Black", Arial, sans-serif;
  --body:"Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5; --chip:#1E3D46;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866; --novo:#3A3416; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F2226; --fg:#FAF1E8; --card:#17323A; --line:#2A4650; --muted:#B9C3C5; --chip:#1E3D46;
  --coral:#FF7A59; --coral-ink:#FF9A7E; --rosa:#FFB8D9; --gold:#C9924B; --gold-ink:#D9A866; --novo:#3A3416; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
.wrap{max-width:1100px; margin:0 auto; padding-block:20px 48px; display:flex; flex-direction:column; gap:20px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.brand img{height:36px; width:auto}
.brand b{font-family:var(--display); font-size:15px; letter-spacing:.02em}
.brand small{display:block; font-size:12px; color:var(--muted); font-weight:600}
h1{font-family:var(--display); font-weight:800; font-size:clamp(24px, 5vw, 32px); line-height:1.15; margin:0; text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.btn{font:inherit; font-weight:700; font-size:14px; border-radius:999px; padding:10px 18px; cursor:pointer; border:1.5px solid var(--line); background:var(--card); color:var(--fg); min-height:44px}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn:disabled{opacity:.5; cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
input, select{font:inherit; font-size:15px; color:var(--fg); background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; min-height:44px}
label{font-weight:600; font-size:13px; display:block; margin-bottom:6px}
.login{max-width:440px; margin:8vh auto 0; display:flex; flex-direction:column; gap:16px}
.login input{width:100%}
.aviso{background:var(--rosa); color:#0F2226; border-radius:14px; padding:14px 16px; font-weight:600}
.erro{color:var(--coral-ink); font-weight:600}
.status{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted)}
.status i{width:9px; height:9px; border-radius:50%; background:var(--line)}
.status.on i{background:#2F9E5C}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap:12px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:4px}
.tile span{font-size:13px; font-weight:600; color:var(--muted)}
.tile b{font-family:var(--display); font-size:28px; font-variant-numeric:tabular-nums}
.tile.cafe{background:var(--rosa); border-color:var(--rosa); color:#0F2226}
.tile.cafe span{color:#0F2226}
.filtros{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.filtros .campo{display:flex; flex-direction:column; min-width:0; flex:1 1 200px}
.lista{display:flex; flex-direction:column; gap:12px}
.resp{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.resp.novo{box-shadow:0 0 0 3px var(--gold)}
.resp summary{list-style:none; cursor:pointer; padding:16px 18px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 16px; align-items:center}
.resp summary::-webkit-details-marker{display:none}
.resp .t{font-weight:700; font-size:16px}
.resp .sub{font-size:13px; color:var(--muted); font-weight:600}
.badges{display:flex; flex-wrap:wrap; gap:6px; grid-column:1 / -1}
.badge{background:var(--chip); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700}
.badge.cafe{background:var(--rosa); color:#0F2226}
.badge.alerta{background:var(--coral); color:#0F2226}
.detalhe{border-top:1px solid var(--line); padding:14px 18px 18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap:10px 24px}
.detalhe div{min-width:0}
.detalhe dt{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.detalhe dd{margin:2px 0 0; font-weight:600; overflow-wrap:anywhere}
.detalhe .full{grid-column:1 / -1}
.contato{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.contato a{color:var(--coral-ink); font-weight:700}
.vazio{background:var(--card); border:1px dashed var(--line); border-radius:16px; padding:32px 20px; text-align:center; color:var(--muted)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:700; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });

let filtro = { cla: "", busca: "", cafe: false };
let canal = null;
const novos = new Set();

{ const ic = document.createElement("link"); ic.rel = "icon"; ic.href = LOGO; document.head.appendChild(ic); }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function lista(v){ return Array.isArray(v) ? v.join(", ") : (v == null ? "" : String(v)); }
function quando(d){ try { return new Date(d).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}); } catch(e){ return d; } }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }
function cabecalho(sair){
  return '<header><div class="brand"><img src="' + LOGO + '" alt=""><div><b>Painel dos Clãs Online</b><small>Get Church Global · Departamento dos Clãs</small></div></div>' +
    (sair ? '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="status" id="status"><i></i>Conectando</span><button class="btn" id="sair" type="button">Sair</button></div>' : '') + '</header>';
}

function telaLogin(msg){
  app.innerHTML = cabecalho(false) +
    '<form class="login" id="form-login" novalidate>' +
    '<h1>Entrar no painel</h1>' +
    '<p class="muted">Digite seu e-mail. Você recebe um link de acesso, sem senha.</p>' +
    '<div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>' +
    '<button class="btn primary" type="submit" id="enviar-link">Receber link de acesso</button>' +
    (msg ? '<div class="' + (msg.tipo === "erro" ? "erro" : "aviso") + '">' + esc(msg.texto) + '</div>' : '') +
    '</form>';
  document.getElementById("form-login").addEventListener("submit", async ev => {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return telaLogin({tipo:"erro", texto:"Confira o e-mail digitado."});
    const b = document.getElementById("enviar-link"); b.disabled = true; b.textContent = "Enviando...";
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: PAINEL_URL } });
    if (error) return telaLogin({tipo:"erro", texto:"Não foi possível enviar o link agora. Aguarde alguns minutos e tente de novo."});
    telaLogin({tipo:"ok", texto:"Pronto. Abra o e-mail enviado para " + email + " e toque no link para entrar."});
  });
}

async function telaPainel(sessao){
  const { data: acesso, error: erroAcesso } = await sb.rpc("tem_acesso_painel");
  if (erroAcesso || !acesso){
    app.innerHTML = cabecalho(true) + '<div class="vazio"><h1 style="margin-bottom:8px">Sem acesso</h1><p>O e-mail ' + esc(sessao.user.email) + ' ainda não está liberado para o painel. Peça à liderança do departamento para incluir você.</p></div>';
    ligarSair(); return;
  }
  app.innerHTML = cabecalho(true) +
    '<div><h1>Respostas da caminhada</h1><p class="muted" id="resumo">Carregando respostas...</p></div>' +
    '<div class="tiles" id="tiles"></div>' +
    '<div class="filtros">' +
      '<div class="campo"><label for="f-cla">Clã</label><select id="f-cla"><option value="">Todos os clãs</option></select></div>' +
      '<div class="campo"><label for="f-busca">Buscar</label><input id="f-busca" type="search" placeholder="Nome, mensagem, resposta"></div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:0;min-height:44px"><input id="f-cafe" type="checkbox" style="min-height:auto;width:18px;height:18px"> Só pedidos de café</label>' +
      '<button class="btn" id="baixar" type="button">Baixar CSV</button>' +
    '</div>' +
    '<div class="lista" id="lista"></div>';
  ligarSair();
  document.getElementById("f-cla").onchange = e => { filtro.cla = e.target.value; desenhar(); };
  document.getElementById("f-busca").oninput = e => { filtro.busca = e.target.value.toLowerCase(); desenhar(); };
  document.getElementById("f-cafe").onchange = e => { filtro.cafe = e.target.checked; desenhar(); };
  document.getElementById("baixar").onclick = baixarCSV;
  await carregar();
  ouvir();
}

function ligarSair(){
  const s = document.getElementById("sair");
  if (s) s.onclick = async () => { if (canal) sb.removeChannel(canal); await sb.auth.signOut(); telaLogin(); };
}

async function carregar(){
  const { data, error } = await sb.from(TABELA).select("*").order("created_at", { ascending: false }).limit(2000);
  if (error){ document.getElementById("resumo").textContent = "Não foi possível carregar as respostas. Atualize a página."; return; }
  linhas = data || [];
  desenhar();
}

function ouvir(){
  canal = sb.channel("respostas-novas")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: TABELA }, p => {
      if (linhas.some(l => l.id === p.new.id)) return;
      linhas.unshift(p.new); novos.add(p.new.id); desenhar();
      toast("Nova resposta do clã " + (p.new.cla || ""));
    })
    .subscribe(st => { const el = document.getElementById("status"); if (!el) return;
      const on = st === "SUBSCRIBED"; el.classList.toggle("on", on); el.lastChild.textContent = on ? "Ao vivo" : "Reconectando"; });
}

function desenhar(){
  const clas = [...new Set(linhas.map(l => l.cla).filter(Boolean))].sort((a,b) => a.localeCompare(b, "pt-BR"));
  const sel = document.getElementById("f-cla");
  if (sel){ const atual = filtro.cla; sel.innerHTML = '<option value="">Todos os clãs</option>' + clas.map(c => '<option' + (c === atual ? ' selected' : '') + '>' + esc(c) + '</option>').join(""); }
  const visiveis = linhas.filter(l => (!filtro.cla || l.cla === filtro.cla) && (!filtro.cafe || l.quer_cafe) &&
    (!filtro.busca || JSON.stringify(l).toLowerCase().includes(filtro.busca)));
  const hoje = new Date().toDateString();
  const notas = visiveis.map(l => l.acolhimento).filter(n => typeof n === "number");
  const media = notas.length ? (notas.reduce((a,b) => a + b, 0) / notas.length).toFixed(1).replace(".", ",") : "Sem notas";
  const semContato = visiveis.filter(l => l.contato_semana === "Não").length;
  document.getElementById("tiles").innerHTML =
    '<div class="tile"><span>Respostas</span><b>' + visiveis.length + '</b></div>' +
    '<div class="tile"><span>Hoje</span><b>' + visiveis.filter(l => new Date(l.created_at).toDateString() === hoje).length + '</b></div>' +
    '<div class="tile cafe"><span>Pediram café</span><b>' + visiveis.filter(l => l.quer_cafe).length + '</b></div>' +
    '<div class="tile"><span>Sem contato na semana</span><b>' + semContato + '</b></div>' +
    '<div class="tile"><span>Acolhimento médio</span><b>' + media + '</b></div>';
  document.getElementById("resumo").textContent = linhas.length ? "Última resposta em " + quando(linhas[0].created_at) + "." : "Nenhuma resposta ainda.";
  const el = document.getElementById("lista");
  if (!visiveis.length){ el.innerHTML = '<div class="vazio">' + (linhas.length ? "Nenhuma resposta com esses filtros." : "As respostas aparecem aqui assim que alguém enviar o questionário.") + '</div>'; return; }
  el.innerHTML = visiveis.map(cartao).join("");
}

function cartao(l){
  const zap = (l.whatsapp || "").replace(/\D/g, "");
  const zapLink = zap ? "https://wa.me/" + (zap.length <= 11 ? "55" + zap : zap) : "";
  const campos = [
    ["Tempo no clã", l.tempo_cla], ["Frequência", l.frequencia], ["Contato na semana", l.contato_semana],
    ["Contato quando falta", l.contato_falta], ["Pontualidade", l.pontualidade], ["Acolhimento", l.acolhimento != null ? l.acolhimento + " de 5" : ""],
    ["O que fortalece", lista(l.ajuda)], ["O que dificulta", lista(l.dificuldades)], ["Convidaria alguém", l.convidaria],
    ["Vida com Deus", l.vida_deus], ["Estudo", l.estudo], ["Serve", l.serve], ["Quer ser preparado(a)", l.preparar],
    ["Horas para servir", l.horas_servir], ["Rotina", lista(l.rotina)], ["Necessidades", lista(l.necessidades)],
    ["Ânimo para servir", l.animo_servir != null ? l.animo_servir + " de 5" : ""]
  ].filter(c => c[1]);
  const badges = [l.funcao ? '<span class="badge">' + esc(l.funcao) + '</span>' : '',
    l.quer_cafe ? '<span class="badge cafe">Pediu café</span>' : '',
    l.contato_semana === "Não" ? '<span class="badge alerta">Sem contato na semana</span>' : '',
    (l.vida_deus === "Distante") ? '<span class="badge alerta">Vida com Deus distante</span>' : '',
    (l.preparar === "Sim") ? '<span class="badge">Quer ser preparado(a)</span>' : ''].join("");
  return '<details class="resp' + (novos.has(l.id) ? ' novo' : '') + '"><summary>' +
    '<div><div class="t">' + esc(l.cla || "Clã não informado") + (l.nome ? ' · ' + esc(l.nome) : '') + '</div><div class="sub">' + esc(quando(l.created_at)) + '</div></div>' +
    '<span class="sub">Ver respostas</span><div class="badges">' + badges + '</div></summary>' +
    '<dl class="detalhe">' +
    (l.quer_cafe ? '<div class="full"><dt>Café online</dt><dd class="contato">' + esc(l.nome || "Sem nome") + (l.whatsapp ? ' · ' + esc(l.whatsapp) + (zapLink ? ' · <a href="' + zapLink + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' : '') : ' · sem telefone') + '</dd></div>' : '') +
    campos.map(c => '<div><dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + '</dd></div>').join("") +
    (l.mensagem ? '<div class="full"><dt>Mensagem para a liderança</dt><dd>' + esc(l.mensagem) + '</dd></div>' : '') +
    '</dl></details>';
}

function baixarCSV(){
  const cols = ["created_at","cla","funcao","tempo_cla","frequencia","contato_semana","contato_falta","pontualidade","acolhimento","ajuda","dificuldades","convidaria","vida_deus","estudo","serve","preparar","horas_servir","rotina","necessidades","animo_servir","mensagem","quer_cafe","nome","whatsapp","versao","id"];
  const celula = v => { const s = Array.isArray(v) ? v.join(", ") : (v == null ? "" : String(v)); return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = String.fromCharCode(0xFEFF) + cols.join(";") + "\n" + linhas.map(l => cols.map(c => celula(l[c])).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "respostas-caminhada-no-cla.csv";
  document.body.appendChild(a); a.click(); a.remove();
}

sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === "SIGNED_IN" && sessao && !app.dataset.painel){ app.dataset.painel = "1"; history.replaceState(null, "", PAINEL_URL); telaPainel(sessao); }
  if (evento === "SIGNED_OUT"){ delete app.dataset.painel; }
});
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session){ app.dataset.painel = "1"; telaPainel(data.session); } else if (!location.hash.includes("access_token")) telaLogin();
})();
</script>
